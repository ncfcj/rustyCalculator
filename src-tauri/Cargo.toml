[package]
name = "rusty_calculator"
version = "0.1.0"
description = "Calculadora desktop em Rust + Tauri 2"
authors = ["ncfcj"]
edition = "2021"
license = "MIT"
repository = "https://github.com/ncfcj/rustyCalculator"

[lib]
name = "rusty_calculator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
